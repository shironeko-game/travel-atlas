<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Travel Atlas — 訪れた国の記録</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --paper: #f2efe6;
    --paper-deep: #e9e4d4;
    --ink: #1f2d3d;
    --ink-soft: #4a5a6a;
    --stamp: #a2321f;
    --stamp-deep: #7c2416;
    --line: #c9c0a8;
    --gold: #b08a3e;

    /* Badge category colors: each category has a fill + a darker stroke/border tone,
       reused across the toggle switch, map country overlay, and city pin states. */
    --badge-continent: #3a5a7a;
    --badge-continent-dark: #25405c;
    --badge-earthmysteries: #5a4a8a;
    --badge-earthmysteries-dark: #3a2f5c;
    --badge-new7wonders: #9a6b4a;
    --badge-new7wonders-dark: #6b4830;
    --badge-grandscenery: #2a8f8a;
    --badge-grandscenery-dark: #1a5c58;
    --badge-humanachievement: #8a3a52;
    --badge-humanachievement-dark: #5c2536;
    --badge-festivals: #c23a7a;
    --badge-festivals-dark: #8a2456;
    --badge-otherevents: #d9782e;
    --badge-otherevents-dark: #a3541c;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--paper);
    font-family:'Georgia','Hiragino Mincho ProN','Yu Mincho',serif;
    color:var(--ink);
    overflow:hidden;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.02) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0, transparent 40%);
    pointer-events:none;
    z-index:0;
  }

  .app{ position:relative; height:100vh; display:flex; flex-direction:column; z-index:1; }

  /* ---------- Map title overlay (sits on top of the map, for screenshots) ---------- */
  .map-overlay-title{
    position:absolute; top:0; left:0; right:0;
    z-index:6; pointer-events:none;
    padding:12px 16px 18px;
    background:linear-gradient(180deg, var(--paper) 0%, var(--paper) 40%, rgba(242,239,230,0) 100%);
    display:flex; align-items:baseline; justify-content:space-between;
    flex-wrap:wrap; gap:8px;
  }
  .map-overlay-title h1{
    margin:0; font-size:19px; letter-spacing:0.06em; font-weight:400;
    color:var(--ink);
    pointer-events:auto; cursor:pointer;
  }
  .map-overlay-title h1 .mark{ color:var(--stamp); font-style:italic; }
  @media (min-width:760px){
    .map-overlay-title{ padding:16px 20px 26px; }
    .map-overlay-title h1{ font-size:22px; letter-spacing:0.08em; }
  }

  /* ---------- Age input popover (tap the "Travel Atlas" title to open) ---------- */
  .age-popover-backdrop{
    position:fixed; inset:0; background:rgba(31,45,61,0.35);
    z-index:50; display:none;
  }
  .age-popover-backdrop.open{ display:block; }
  .age-popover{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#fffdf8; border:1px solid var(--line); border-radius:3px;
    padding:20px 22px; z-index:51; width:min(300px, 84vw);
    box-shadow:0 12px 32px rgba(0,0,0,0.18);
  }
  .age-popover h2{
    margin:0 0 4px; font-size:15px; font-weight:400; color:var(--ink);
    letter-spacing:0.03em;
  }
  .age-popover p{
    margin:0 0 14px; font-size:12px; color:var(--ink-soft); line-height:1.5;
  }
  .age-popover input{
    width:100%; padding:9px 12px; font-size:15px;
    border:1px solid var(--line); border-radius:2px;
    background:var(--paper-deep); color:var(--ink);
    font-family:inherit; outline:none; box-sizing:border-box;
  }
  .age-popover input:focus{ border-color:var(--gold); }
  .age-popover-actions{
    display:flex; gap:8px; margin-top:14px;
  }
  .age-popover-actions button{
    flex:1; padding:9px 0; font-size:12.5px; letter-spacing:0.03em;
    border:1px solid var(--line); background:#fffdf8; color:var(--ink);
    border-radius:2px; cursor:pointer; font-family:inherit;
  }
  .age-popover-actions button.primary{
    background:var(--ink); color:#f2efe6; border-color:var(--ink);
  }

  /* ---------- Wide layout (side panel) ---------- */
  .main-row{ flex:1; display:flex; min-height:0; }
  .map-col{ flex:1; position:relative; min-width:0; min-height:0; display:flex; flex-direction:column; }
  .side-panel{
    display:none;
    width:280px; flex-shrink:0;
    background:#fffdf8; border-left:1px solid var(--line);
    flex-direction:column; min-height:0;
  }
  @media (min-width:760px){
    .side-panel{ display:flex; }
    .sheet{ display:none; }
  }

  /* Mobile/narrow: map stays compact on top, country list gets the larger remaining share below */
  @media (max-width:759px){
    .main-row{ flex:0 1 38%; min-height:0; max-height:38%; }
    .sheet{ flex:1 1 62%; min-height:0; max-height:none; }
  }
  .side-panel .panel-head{
    padding:14px 16px; border-bottom:1px solid #efe9d8;
  }
  .side-panel .panel-head .search-row{ position:relative; }
  .side-panel .panel-head .suggest{
    top:calc(100% + 4px); bottom:auto;
    box-shadow:0 6px 18px rgba(0,0,0,0.12);
  }
  .side-total-row{
    padding:8px 16px; border-bottom:1px solid #efe9d8;
    font-family:'Courier New', monospace; font-size:12px;
    color:var(--ink-soft); letter-spacing:0.03em;
  }
  .side-panel .panel-body{
    flex:1; overflow-y:auto; padding:12px 16px;
  }
  .side-panel .panel-body .list-title{
    font-size:11px; letter-spacing:0.1em; color:var(--ink-soft);
    margin-bottom:8px;
  }
  .side-list{ display:flex; flex-direction:column; gap:6px; }
  .side-list .row{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; background:var(--paper-deep);
    border:1px solid var(--line); border-radius:2px; font-size:13.5px;
  }
  .side-list .row button{
    border:none; background:none; color:var(--stamp-deep);
    font-size:15px; cursor:pointer; line-height:1;
  }
  .side-panel .panel-actions{
    padding:10px 16px 16px; border-top:1px solid #efe9d8;
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .side-panel .panel-actions button{
    flex:1 1 calc(50% - 4px); min-width:0; padding:9px 2px; font-size:11.5px; letter-spacing:0.02em;
    border:1px solid var(--line); background:#fffdf8; color:var(--ink);
    border-radius:2px; cursor:pointer; font-family:inherit;
  }
  .side-panel .panel-actions button.primary{
    background:var(--ink); color:#f2efe6; border-color:var(--ink);
  }

  /* ---------- Search bar (kept away from the map for clean screenshots) ---------- */
  .search-row{ position:relative; }
  .search-row input{
    width:100%; padding:10px 14px; font-size:14px;
    border:1px solid var(--line); border-radius:2px;
    background:#fffdf8; color:var(--ink);
    font-family:inherit;
    outline:none;
  }
  .search-row input:focus{ border-color:var(--gold); }
  .suggest{
    position:absolute; bottom:calc(100% + 4px); left:0; right:0;
    background:#fffdf8; border:1px solid var(--line); border-radius:2px;
    max-height:220px; overflow-y:auto;
    box-shadow:0 -6px 18px rgba(0,0,0,0.12);
    display:none; z-index:20;
  }
  .suggest.open{ display:block; }
  .suggest-item{
    padding:9px 14px; font-size:13.5px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid #efe9d8;
  }
  .suggest-item:last-child{ border-bottom:none; }
  .suggest-item:hover, .suggest-item.active{ background:var(--paper-deep); }
  .suggest-item .visited-tag{
    font-size:10px; color:var(--stamp); letter-spacing:0.05em;
  }

  /* City search row lives inside the page body, so its suggestion list opens downward */
  .city-search-row{ margin-bottom:10px; }
  .city-search-row .suggest{
    top:calc(100% + 4px); bottom:auto;
    box-shadow:0 6px 18px rgba(0,0,0,0.12);
  }
  .city-search-row input{ font-size:13px; padding:8px 12px; }

  /* Unified top search slot: shows the country or city search row depending on the active tab */
  .search-target{ display:none; }
  .search-target.active{ display:block; }

  /* Mobile: fixed search bar pinned to the very top, above the map */
  .mobile-search-bar{
    display:block;
    padding:10px 14px; border-bottom:1px solid var(--line);
    background:#fffdf8; z-index:7;
  }
  .mobile-search-bar .suggest{
    top:calc(100% + 4px); bottom:auto;
    box-shadow:0 6px 18px rgba(0,0,0,0.12);
  }
  @media (min-width:760px){
    .mobile-search-bar{ display:none; }
  }

  /* ---------- Map ---------- */
  .map-wrap{
    flex:1; position:relative; overflow:hidden;
    touch-action: none;
    min-height:300px;
  }
  #map{ width:100%; height:100%; display:block; cursor:grab; }
  #map:active{ cursor:grabbing; }
  @media (max-width:759px){
    .map-wrap{ min-height:150px; }
    #map{ min-height:150px; }
  }

  .country-path{
    stroke:#8f9a86; stroke-width:0.4; fill:#dcd6c4;
    transition:fill 0.35s ease;
    cursor:pointer;
  }
  .country-path:hover{ fill:#c9c2a6; }
  .country-path.visited{
    fill:var(--stamp);
    stroke:var(--stamp-deep);
  }
  .country-path.visited:hover{ fill:var(--stamp-deep); }
  /* Unvisited countries belonging to a not-yet-unlocked badge category, shown per-category color.
     Priority when multiple overlays are on and a country matches more than one: earthmysteries > new7wonders > grandscenery > humanachievement > festivals > otherevents > continent */
  .country-path.badge-target-continent{
    fill:var(--badge-continent);
    stroke:var(--badge-continent-dark);
  }
  .country-path.badge-target-continent:hover{ fill:#2e4a66; }
  .country-path.badge-target-earthmysteries{
    fill:var(--badge-earthmysteries);
    stroke:var(--badge-earthmysteries-dark);
  }
  .country-path.badge-target-earthmysteries:hover{ fill:#4a3d73; }
  .country-path.badge-target-new7wonders{
    fill:var(--badge-new7wonders);
    stroke:var(--badge-new7wonders-dark);
  }
  .country-path.badge-target-new7wonders:hover{ fill:#835a3d; }
  .country-path.badge-target-grandscenery{
    fill:var(--badge-grandscenery);
    stroke:var(--badge-grandscenery-dark);
  }
  .country-path.badge-target-grandscenery:hover{ fill:#237a76; }
  .country-path.badge-target-humanachievement{
    fill:var(--badge-humanachievement);
    stroke:var(--badge-humanachievement-dark);
  }
  .country-path.badge-target-humanachievement:hover{ fill:#732f44; }
  .country-path.badge-target-festivals{
    fill:var(--badge-festivals);
    stroke:var(--badge-festivals-dark);
  }
  .country-path.badge-target-festivals:hover{ fill:#a82f68; }
  .country-path.badge-target-otherevents{
    fill:var(--badge-otherevents);
    stroke:var(--badge-otherevents-dark);
  }
  .country-path.badge-target-otherevents:hover{ fill:#c06a26; }
  .sphere{ fill:#fffdf8; stroke:var(--line); stroke-width:1; }
  .graticule{ fill:none; stroke:#d8d2bf; stroke-width:0.4; }

  /* ---------- City pins ---------- */
  .city-pin{ cursor:pointer; }
  .city-pin .pin-drop{
    fill:var(--gold); stroke:#7a5f28; stroke-width:0.6;
    transition:transform 0.15s ease;
    transform-origin:0 0;
  }
  .city-pin .pin-dot{
    fill:#fffdf8;
    transform-origin:0 -10px;
  }
  .city-pin:hover .pin-drop{ fill:#c9a24e; }

  /* Star badge + glow + enlarged pin for cities that earned a theme badge, so they stand out
     clearly from ordinary visited-city pins on the map */
  .city-pin .pin-star{
    fill:#ffd23f; stroke:#8a5f0a; stroke-width:0.25; paint-order:stroke;
    pointer-events:none;
  }
  .city-pin.badge-achieved .pin-drop{
    transform:scale(1.35);
    filter:drop-shadow(0 0 3px rgba(255,210,63,0.85)) drop-shadow(0 0 6px rgba(255,210,63,0.5));
  }
  .city-pin.badge-achieved .pin-dot{
    transform:scale(1.35);
  }

  /* Unvisited "theme badge" candidate cities, shown while that badge's toggle is on */
  .city-pin.badge-candidate-earthmysteries .pin-drop{
    fill:var(--badge-earthmysteries); stroke:var(--badge-earthmysteries-dark); stroke-width:0.6;
  }
  .city-pin.badge-candidate-earthmysteries:hover .pin-drop{ fill:#4a3d73; }
  .city-pin.badge-candidate-new7wonders .pin-drop{
    fill:var(--badge-new7wonders); stroke:var(--badge-new7wonders-dark); stroke-width:0.6;
  }
  .city-pin.badge-candidate-new7wonders:hover .pin-drop{ fill:#835a3d; }
  .city-pin.badge-candidate-grandscenery .pin-drop{
    fill:var(--badge-grandscenery); stroke:var(--badge-grandscenery-dark); stroke-width:0.6;
  }
  .city-pin.badge-candidate-grandscenery:hover .pin-drop{ fill:#237a76; }
  .city-pin.badge-candidate-humanachievement .pin-drop{
    fill:var(--badge-humanachievement); stroke:var(--badge-humanachievement-dark); stroke-width:0.6;
  }
  .city-pin.badge-candidate-humanachievement:hover .pin-drop{ fill:#732f44; }
  .city-pin.badge-candidate-festivals .pin-drop{
    fill:var(--badge-festivals); stroke:var(--badge-festivals-dark); stroke-width:0.6;
  }
  .city-pin.badge-candidate-festivals:hover .pin-drop{ fill:#a82f68; }
  .city-pin.badge-candidate-otherevents .pin-drop{
    fill:var(--badge-otherevents); stroke:var(--badge-otherevents-dark); stroke-width:0.6;
  }
  .city-pin.badge-candidate-otherevents:hover .pin-drop{ fill:#c06a26; }

  /* Visited cities that earned a themed badge, shown in that badge's color instead of the default gold */
  .city-pin.badge-achieved-earthmysteries .pin-drop{
    fill:var(--badge-earthmysteries); stroke:#241d3c; stroke-width:1;
  }
  .city-pin.badge-achieved-earthmysteries:hover .pin-drop{ fill:#4a3d73; }
  .city-pin.badge-achieved-new7wonders .pin-drop{
    fill:var(--badge-new7wonders); stroke:#4a3220; stroke-width:1;
  }
  .city-pin.badge-achieved-new7wonders:hover .pin-drop{ fill:#835a3d; }
  .city-pin.badge-achieved-grandscenery .pin-drop{
    fill:var(--badge-grandscenery); stroke:#123a37; stroke-width:1;
  }
  .city-pin.badge-achieved-grandscenery:hover .pin-drop{ fill:#237a76; }
  .city-pin.badge-achieved-humanachievement .pin-drop{
    fill:var(--badge-humanachievement); stroke:#3c1725; stroke-width:1;
  }
  .city-pin.badge-achieved-humanachievement:hover .pin-drop{ fill:#732f44; }
  .city-pin.badge-achieved-festivals .pin-drop{
    fill:var(--badge-festivals); stroke:#5c1638; stroke-width:1;
  }
  .city-pin.badge-achieved-festivals:hover .pin-drop{ fill:#a82f68; }
  .city-pin.badge-achieved-otherevents .pin-drop{
    fill:var(--badge-otherevents); stroke:#6e3712; stroke-width:1;
  }
  .city-pin.badge-achieved-otherevents:hover .pin-drop{ fill:#c06a26; }

  /* Temporary highlight after tapping a badge card, to show exactly where that site is */
  .city-pin.pin-highlighted .pin-drop{
    fill:#c0392b !important; stroke:#7a1f16 !important; stroke-width:1.2 !important;
    animation: pin-pulse 0.9s ease-in-out infinite;
  }
  @keyframes pin-pulse{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.35); }
  }

  .tooltip{
    position:fixed; pointer-events:none;
    background:var(--ink); color:#f2efe6;
    padding:6px 10px; font-size:12.5px; border-radius:2px;
    font-family:'Courier New', monospace; letter-spacing:0.03em;
    opacity:0; transition:opacity 0.12s; z-index:30;
    white-space:nowrap;
  }
  .tooltip.show{ opacity:0.95; }

  /* ---------- Zoom controls (collapsible) ---------- */
  .zoom-ctrl{
    position:absolute; right:14px; bottom:20px;
    display:flex; flex-direction:column; align-items:flex-end; gap:6px; z-index:10;
  }
  .zoom-ctrl-toggle{
    width:36px; height:36px; border:1px solid var(--line);
    background:#fffdf8; color:var(--ink-soft); font-size:15px;
    border-radius:2px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.2s ease;
  }
  .zoom-ctrl.collapsed .zoom-ctrl-toggle{ transform:rotate(180deg); }
  .zoom-ctrl-buttons{
    display:flex; flex-direction:column; gap:6px;
    max-height:200px; overflow:hidden;
    transition:max-height 0.22s ease, opacity 0.18s ease;
    opacity:1;
  }
  .zoom-ctrl.collapsed .zoom-ctrl-buttons{
    max-height:0; opacity:0;
  }
  .zoom-ctrl button{
    width:36px; height:36px; border:1px solid var(--line);
    background:#fffdf8; color:var(--ink); font-size:18px;
    border-radius:2px; cursor:pointer;
  }
  .zoom-ctrl button:active{ background:var(--paper-deep); }

  /* Hide floating UI chrome while taking a clean map screenshot */
  .map-wrap.capturing .zoom-ctrl,
  .map-wrap.capturing .tooltip{
    display:none !important;
  }

  /* ---------- Bottom panel: visited list (always expanded, fixed half of the screen on mobile) ---------- */
  .sheet{
    position:relative; z-index:8;
    background:#fffdf8; border-top:1px solid var(--line);
    display:flex; flex-direction:column;
    box-shadow:0 -6px 16px rgba(0,0,0,0.06);
  }
  .sheet-handle{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; user-select:none;
    border-bottom:1px solid #efe9d8;
  }
  .sheet-handle .title{
    font-size:13px; letter-spacing:0.08em; color:var(--ink-soft);
  }

  .sheet-body{ flex:1; overflow-y:auto; padding:4px 16px 12px; min-height:0; }

  /* ---------- Continent grouping + drag-to-reorder ---------- */
  .continent-section{ margin-bottom:12px; }
  .continent-section:last-child{ margin-bottom:0; }
  .continent-heading{
    font-size:10.5px; letter-spacing:0.08em; color:var(--ink-soft);
    margin-bottom:5px; padding-left:2px;
  }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    display:flex; align-items:center; gap:4px;
    background:var(--paper-deep); border:1px solid var(--line);
    border-radius:2px; padding:4px 8px; font-size:12px;
  }
  .chip .flag{ font-size:13px; }
  .chip button{
    border:none; background:none; color:var(--stamp-deep);
    font-size:13px; cursor:pointer; line-height:1; padding:0 0 0 2px;
  }
  .draggable-item{ cursor:grab; touch-action:none; }
  .draggable-item.dragging{ opacity:0.4; }
  .drag-handle{
    font-size:11px; color:var(--ink-soft); opacity:0.6; cursor:grab;
    line-height:1; margin-right:1px;
  }
  .empty-note{
    font-size:12.5px; color:var(--ink-soft); padding:10px 2px;
    font-style:italic;
  }

  /* ---------- List pager: switches between "visited countries" and badge pages ---------- */
  .list-pager{
    display:flex; gap:4px; padding:0 16px 6px; flex-shrink:0;
  }
  .list-pager button{
    flex:1; padding:5px 2px; font-size:10.5px; letter-spacing:0.01em;
    border:1px solid var(--line); background:#fffdf8; color:var(--ink-soft);
    border-radius:2px; cursor:pointer; font-family:inherit;
    white-space:nowrap;
  }
  .list-pager button.active{
    background:var(--ink); color:#f2efe6; border-color:var(--ink);
  }
  .page{ display:none; }
  .page.active{ display:block; }

  /* ---------- Themed & continent badges: each category has its own toggle + map overlay color ---------- */
  .badge-section-row{
    display:flex; align-items:center; justify-content:space-between;
    margin:10px 0 5px; padding-left:2px; position:relative;
  }
  .badge-section-row:first-child{ margin-top:0; }
  .badge-section-title{
    display:flex; align-items:center; gap:5px;
  }
  .badge-section-label{
    font-size:10.5px; letter-spacing:0.08em; color:var(--ink-soft);
  }
  .badge-info-btn{
    flex-shrink:0; width:15px; height:15px; border-radius:50%;
    border:1px solid var(--line); background:#fffdf8; color:var(--ink-soft);
    font-size:9.5px; line-height:1; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;
  }
  .badge-info-btn:hover, .badge-info-btn.open{ background:var(--paper-deep); color:var(--ink); }
  .badge-info-popover{
    display:none;
    position:absolute; top:calc(100% + 6px); left:2px; right:2px;
    background:var(--ink); color:#f2efe6;
    padding:8px 10px; border-radius:2px; font-size:11px; line-height:1.5;
    z-index:15; box-shadow:0 6px 16px rgba(0,0,0,0.18);
  }
  .badge-info-popover.open{ display:block; }

  function achievedThemeBadges(){
    const achieved = new Set();
    const visitedNames = new Set();
    visited.forEach(id => {
      const item = nameIndex.find(n => n.id === id);
      if(item) visitedNames.add(item.name_en);
    });
    THEME_BADGES.forEach(badge => {
      const items = badge.matchBy === 'city' ? badge.cities : badge.countries;
      const has = badge.matchBy === 'city'
        ? (cid => visitedCities.has(cid))
        : (c => visitedNames.has(c));
      const hit = badge.matchMode === 'all' ? items.every(has) : items.some(has);
      if(hit) achieved.add(badge.id);
    });
    return achieved;
  }

  function groupedVisitedByContinent(){
    // Build {id, label} for every visited country, resolve its continent,
    // then order each continent's members by countryOrder (manual drag order),
    // falling back to alphabetical for anything not yet in countryOrder.
    // Note: "eurasia" is split into "eurasia_europe" / "eurasia_asia" for DISPLAY GROUPING ONLY.
    // Badge achievement and the map's blue overlay still treat eurasia as a single continent.
    const items = [...visited].map(id => {
      const entry = nameIndex.find(n => n.id === id);
      const continent = entry ? continentOfFeature(entry.feature) : (CONTINENT_MAP[id] || null);
      let displayGroup = continent || 'other';
      if(displayGroup === 'eurasia'){
        const sub = eurasiaSubregion(id, entry ? entry.feature : null);
        displayGroup = sub === 'europe' ? 'eurasia_europe' : 'eurasia_asia';
      }
      return { id, label: labelFor(id), continent: displayGroup };
    });

    const byContinent = {};
    items.forEach(item => {
      if(!byContinent[item.continent]) byContinent[item.continent] = [];
      byContinent[item.continent].push(item);
    });

    Object.keys(byContinent).forEach(cont => {
      byContinent[cont].sort((a, b) => {
        const ai = countryOrder.indexOf(a.id);
        const bi = countryOrder.indexOf(b.id);
        if(ai === -1 && bi === -1) return a.label.localeCompare(b.label, 'ja');
        if(ai === -1) return 1;
        if(bi === -1) return -1;
        return ai - bi;
      });
    });

    // Continent display order follows BADGES, with eurasia split into Europe then Asia,
    // and any unmapped country in a final "other" group.
    const GROUP_LABELS = {
      eurasia_europe: 'ユーラシア（ヨーロッパ）',
      eurasia_asia: 'ユーラシア（アジア）'
    };
    const order = [];
    BADGES.forEach(b => {
      if(b.id === 'eurasia'){ order.push('eurasia_europe', 'eurasia_asia'); }
      else { order.push(b.id); }
    });
    order.push('other');

    return order
      .filter(cont => byContinent[cont] && byContinent[cont].length > 0)
      .map(cont => ({
        continent: cont,
        label: GROUP_LABELS[cont] || (BADGES.find(b => b.id === cont) || { name: 'その他' }).name,
        items: byContinent[cont]
      }));
  }

  // ---- Generic drag-to-reorder used by both the country list and the city list ----
  // getOrder/setOrder let the same handlers work against either countryOrder or cityOrder
  // without needing a mutable array reference (JS reassignment would break that).
  function attachDragReorderHandlers(el, list, reorderCtx){
    el.addEventListener('dragstart', (e) => {
      el.classList.add('dragging');
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', el.dataset.id);
      }
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      commitReorderFromDom(list, reorderCtx);
    });
    el.addEventListener('dragover', (e) => {
      e.preventDefault();
      const dragging = list.querySelector('.dragging');
      if(!dragging || dragging === el) return;
      const rect = el.getBoundingClientRect();
      const before = (e.clientX - rect.left) < rect.width / 2;
      list.insertBefore(dragging, before ? el : el.nextSibling);
    });
  }

  function commitReorderFromDom(list, reorderCtx){
    const ids = [...list.querySelectorAll('.draggable-item')].map(el => el.dataset.id);
    const currentOrder = reorderCtx.getOrder();
    const otherIds = currentOrder.filter(id => !ids.includes(id));
    let newOrder = [...new Set([...otherIds, ...ids])];
    // Safety net: append any visited id that hasn't been dragged yet, so first-time drags don't drop entries
    reorderCtx.getAllVisitedIds().forEach(id => {
      if(!newOrder.includes(id)) newOrder.push(id);
    });
    reorderCtx.setOrder(newOrder);
    reorderCtx.save();
    reorderCtx.rerender();
  }

        if(overlayToggles.continent){
          const c = continentOfFeature(d);
          continentHit = !!(c && !achievedCont.has(c));
        }
        themeHit = themeBadgesByPriority.find(badge =>
          overlayToggles[badge.id] && name && badge.overlayCountries.includes(name) && !achievedTheme.has(badge.id)
        );
      }

      el.classed('badge-target-continent', continentHit && !themeHit);
      el.classed('badge-target-earthmysteries', themeHit && themeHit.id === 'earthmysteries');
      el.classed('badge-target-new7wonders', themeHit && themeHit.id === 'new7wonders');
      el.classed('badge-target-grandscenery', themeHit && themeHit.id === 'grandscenery');
      el.classed('badge-target-humanachievement', themeHit && themeHit.id === 'humanachievement');
      el.classed('badge-target-festivals', themeHit && themeHit.id === 'festivals');
      el.classed('badge-target-otherevents', themeHit && themeHit.id === 'otherevents');
    });
  }

  function updateBadges(){
    const achieved = achievedContinents();
    const achievedTheme = achievedThemeBadges();
    const sideBadgeGrid = document.getElementById('sideBadgeGrid');
    const sheetBadgeGrid = document.getElementById('sheetBadgeGrid');
    if(sideBadgeGrid) renderBadgeGrid(sideBadgeGrid, achieved, achievedTheme);
    if(sheetBadgeGrid) renderBadgeGrid(sheetBadgeGrid, achieved, achievedTheme);

  // ---------- Cities ----------
  function cityCountKey(cityId){
    // Two MAJOR_CITIES entries that represent the same physical city (e.g. "Venice" and
    // "Venice (Biennale)") share a countsAs key, so visiting both only counts once.
    const city = MAJOR_CITIES.find(c => c.id === cityId);
    return (city && city.countsAs) ? city.countsAs : cityId;
  }

  function totalCityCount(){
    const uniqueKeys = new Set();
    visitedCities.forEach(id => uniqueKeys.add(cityCountKey(id)));
    customCities.forEach(c => uniqueKeys.add(c.id)); // free-text entries are always distinct
    return uniqueKeys.size;
  }

  let highlightTimer = null;

  // Called when a "New 7 Wonders" (or similar) badge card is tapped: makes sure the city's pin
  // is actually visible on the map (turning on that badge's overlay toggle if needed), pans/zooms
  // to it, and flags it red for a few seconds so the traveler can see exactly where it is.
  function highlightCityPin(cityId){
    const city = MAJOR_CITIES.find(c => c.id === cityId);
    if(!city) return;

    // Tapping a badge card always turns that badge's map overlay toggle on, regardless of
    // whether the city has been visited yet, so the traveler can see the whole category at a glance.
    const owningBadge = THEME_BADGES.find(b => b.matchBy === 'city' && b.cities.includes(cityId));
    if(owningBadge && !overlayToggles[owningBadge.id]){
      overlayToggles[owningBadge.id] = true;
      try{ localStorage.setItem(BADGE_TOGGLE_KEY, JSON.stringify(overlayToggles)); }catch(e){}
      applyBadgeOverlay();
      updateBadges();
    }

    highlightedCityId = cityId;
    renderCityPins();

    // Pan/zoom the map to the city so the highlighted pin is actually in view
    const p = projection([city.lon, city.lat]);
    if(p){
      const scale = 4;
      const translate = [width/2 - scale*p[0], height/2 - scale*p[1]];
      svg.transition().duration(500).call(
        zoomBehavior.transform,
        d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
      );
    }

    clearTimeout(highlightTimer);
    highlightTimer = setTimeout(() => {
      highlightedCityId = null;
      renderCityPins();
    }, 3000);
  }

  function renderCityPins(){
    const achievedTheme = achievedThemeBadges();
    // Any THEME_BADGES entry with matchBy:'city' can show unvisited candidate pins while its
    // toggle is on and the badge hasn't been achieved yet. Priority when a city is a candidate
    // for more than one active badge: earthmysteries > new7wonders > grandscenery > humanachievement > festivals > otherevents (matches the map overlay's priority).
    const cityBadges = ['earthmysteries', 'new7wonders', 'grandscenery', 'humanachievement', 'festivals', 'otherevents'].map(id => THEME_BADGES.find(b => b.id === id)).filter(Boolean);
    const candidateBadgesByPriority = cityBadges.filter(b => overlayToggles[b.id] && !achievedTheme.has(b.id));

    // A visited city that belongs to a theme badge's city list is tagged with that badge's
    // theme color instead of the default gold pin — judged per-city (matching each card's own
    // "達成 ✓" state in the badge panel). Only shown while that badge's map-overlay toggle is on,
    // so the special pin styling stays tied to the toggle the traveler is currently looking at.
    function achievedBadgeIdForCity(cityId){
      const hit = cityBadges.find(b => overlayToggles[b.id] && b.cities.includes(cityId));
      return hit ? hit.id : null;
    }

    const visitedPinData = MAJOR_CITIES
      .filter(c => visitedCities.has(c.id))
      .map(c => Object.assign({}, c, { achievedBadgeId: achievedBadgeIdForCity(c.id) }));

    const candidateIdsSeen = new Set();
    const candidatePinData = [];
    candidateBadgesByPriority.forEach(badge => {
      badge.cities.forEach(cid => {
        if(visitedCities.has(cid) || candidateIdsSeen.has(cid)) return;
        const city = MAJOR_CITIES.find(c => c.id === cid);
        if(!city) return;
        candidateIdsSeen.add(cid);
        candidatePinData.push(Object.assign({}, city, { isCandidate:true, candidateBadgeId:badge.id }));
      });
    });

    const pinData = visitedPinData.concat(candidatePinData);

    const pins = cityPinsG.selectAll('.city-pin')
      .data(pinData, d => d.id);

    pins.exit().remove();

    const BADGE_LABELS = { earthmysteries:'地球の神秘（四大絶景以外）（未訪問）', new7wonders:'世界の建造物（新世界七不思議）（未訪問）', grandscenery:'地球の神秘（四大絶景）（未訪問）', humanachievement:'世界の建造物（新世界七不思議以外）（未訪問）', festivals:'世界のイベント（四大祭）（未訪問）', otherevents:'世界のイベント（未訪問）' };
    const ACHIEVED_LABELS = { earthmysteries:'地球の神秘（四大絶景以外） 達成', new7wonders:'世界の建造物（新世界七不思議） 達成', grandscenery:'地球の神秘（四大絶景） 達成', humanachievement:'世界の建造物（新世界七不思議以外） 達成', festivals:'世界のイベント（四大祭） 達成', otherevents:'世界のイベント 達成' };

    const entered = pins.enter()
      .append('g')
      .attr('class', 'city-pin')
      .on('click', (event, d) => {
        event.stopPropagation();
        // A candidate pin marks the city visited on click; a visited pin removes it
        toggleCity(d.id, d.isCandidate ? true : false);
      })
      .on('mousemove', (event, d) => {
        const label = d.isCandidate
          ? `${d.name_ja}（未訪問・${BADGE_LABELS[d.candidateBadgeId]}）`
          : (d.achievedBadgeId ? `${d.name_ja}（${ACHIEVED_LABELS[d.achievedBadgeId]}）` : d.name_ja);
        showTooltip(label, event.clientX, event.clientY);
      })
      .on('mouseleave', hideTooltip)
      .on('touchstart', (event, d) => {
        const t = event.touches[0];
        const label = d.isCandidate
          ? `${d.name_ja}（未訪問・${BADGE_LABELS[d.candidateBadgeId]}）`
          : (d.achievedBadgeId ? `${d.name_ja}（${ACHIEVED_LABELS[d.achievedBadgeId]}）` : d.name_ja);
        showTooltip(label, t.clientX, t.clientY);
        clearTimeout(tooltipTimer);
        tooltipTimer = setTimeout(hideTooltip, 1200);
      });

    // Simple teardrop pin drawn with a circle + triangle point, anchored at the bottom tip
    entered.append('path')
      .attr('class', 'pin-drop')
      .attr('d', 'M0,0 C-5,-8 -5,-14 0,-14 C5,-14 5,-8 0,0 Z');
    entered.append('circle')
      .attr('class', 'pin-dot')
      .attr('r', 2)
      .attr('cy', -10);
    // Small star badge shown only on pins earned by completing a theme badge, overlapping the
    // top tip of the pin. Opacity is set directly (not just via CSS class) so it reliably shows
    // on both new and re-rendered pins.
    entered.append('text')
      .attr('class', 'pin-star')
      .attr('x', 0)
      .attr('y', -10)
      .attr('text-anchor', 'middle')
      .attr('dominant-baseline', 'central')
      .attr('font-size', 4.5)
      .text('★');

    cityPinsG.selectAll('.city-pin').select('.pin-star')
      .attr('opacity', d => (!d.isCandidate && d.achievedBadgeId) ? 1 : 0);

    // Apply exactly one badge-candidate-* / badge-achieved-* class per pin (all THEME_BADGES ids
    // are mutually exclusive per pin), rather than testing each of the 6 category ids individually.
    cityPinsG.selectAll('.city-pin')
      .attr('class', d => {
        const classes = ['city-pin'];
        if(d.isCandidate && d.candidateBadgeId) classes.push('badge-candidate-' + d.candidateBadgeId);
        if(!d.isCandidate && d.achievedBadgeId){
          classes.push('badge-achieved-' + d.achievedBadgeId, 'badge-achieved');
        }
        if(d.id === highlightedCityId) classes.push('pin-highlighted');
        return classes.join(' ');
      })
      .attr('transform', d => {
        const p = projection([d.lon, d.lat]);
        return p ? `translate(${p[0]},${p[1]})` : null;
      });
  }

  function groupedVisitedCitiesByContinent(){
    const items = [...visitedCities].map(id => {
      const item = MAJOR_CITIES.find(c => c.id === id);
      const continent = item ? item.continent : 'other';
      return { id, label: item ? item.name_ja : id, hasPin:true, continent };
    }).concat(
      customCities.map(c => ({ id:c.id, label:c.name, hasPin:false, continent:'other' }))
    );

    const byContinent = {};
    items.forEach(item => {
      if(!byContinent[item.continent]) byContinent[item.continent] = [];
      byContinent[item.continent].push(item);
    });

    Object.keys(byContinent).forEach(cont => {
      byContinent[cont].sort((a, b) => {
        const ai = cityOrder.indexOf(a.id);
        const bi = cityOrder.indexOf(b.id);
        if(ai === -1 && bi === -1) return a.label.localeCompare(b.label, 'ja');
        if(ai === -1) return 1;
        if(bi === -1) return -1;
        return ai - bi;
      });
    });

    const GROUP_LABELS = {
      north_america:'北アメリカ', south_america:'南アメリカ',
      europe:'ユーラシア（ヨーロッパ）', asia:'ユーラシア（アジア）',
      africa:'アフリカ', oceania:'オセアニア', antarctica:'南極', other:'その他'
    };
    const order = ['north_america','south_america','europe','asia','africa','oceania','antarctica','other'];

    return order
      .filter(cont => byContinent[cont] && byContinent[cont].length > 0)
      .map(cont => ({ continent:cont, label:GROUP_LABELS[cont], items:byContinent[cont] }));
  }

  function renderCityContinentGroups(container, tag, emptyNoteId){
    container.innerHTML = '';

      section.appendChild(heading);

      const list = document.createElement('div');

      list.dataset.continent = group.continent;

      group.items.forEach(({id, label, hasPin}) => {

        el.draggable = true;
        el.dataset.id = id;

        el.innerHTML = `<span class="drag-handle">⠿</span>${pinMark}<span>${label}</span><button data-id="${id}" aria-label="削除">×</button>`;
        el.querySelector('button').addEventListener('click', (e) => {
          e.stopPropagation();
          toggleCity(id, false);
        });
        attachDragReorderHandlers(el, list, cityReorderCtx);

      });

      section.appendChild(list);
      container.appendChild(section);
    });
  }

  const cityReorderCtx = {

  function updateCityStats(){

  function updateAgeDiff(){
    const els = document.querySelectorAll('.age-diff');
    if(els.length === 0) return;
    if(userAge === null){
      els.forEach(el => {
        el.textContent = '';
        el.className = 'age-diff';
      });
      return;
    }
    const diff = totalCityCount() - userAge;
    const sign = diff > 0 ? '+' : (diff < 0 ? '' : '±');
    const text = ` (年齢${sign}${diff})`;
    const extraClass = diff > 0 ? ' positive' : (diff < 0 ? ' negative' : '');
    els.forEach(el => {
      el.textContent = text;
      el.className = 'age-diff' + extraClass;
    });
  }

  function toggleCity(id, forceState){
    const isMajor = MAJOR_CITIES.some(c => c.id === id);
    if(isMajor){
      const willVisit = forceState !== undefined ? forceState : !visitedCities.has(id);
      if(willVisit){
        visitedCities.add(id);
        if(!cityOrder.includes(id)) cityOrder.push(id);
      } else {
        visitedCities.delete(id);
        cityOrder = cityOrder.filter(cid => cid !== id);
      }
      renderCityPins();
    } else {
      // Custom (free-text) city: forceState=false means remove by id
      if(forceState === false){
        customCities = customCities.filter(c => c.id !== id);
        cityOrder = cityOrder.filter(cid => cid !== id);
      }
    }
    updateCityChips();
    updateCityStats();
    updateBadges();
    saveCityState();
    saveCityOrder();
  }

  function addCustomCity(name){
    const trimmed = name.trim();
    if(!trimmed) return;
    const id = 'custom-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    customCities.push({ id, name: trimmed });
    cityOrder.push(id);
    updateCityChips();
    updateCityStats();
    saveCityState();
    saveCityOrder();
  }

  function toggleCountry(id, forceState){
    const willVisit = forceState !== undefined ? forceState : !visited.has(id);
    if(willVisit){
      visited.add(id);
      if(!countryOrder.includes(id)) countryOrder.push(id);
    } else {
      visited.delete(id);
      countryOrder = countryOrder.filter(cid => cid !== id);
    }
    countriesG.selectAll('path')
      .classed('visited', d => visited.has(idOf(d)));
    updateStats();
    updateChips();
    updateBadges();
    saveState();
    saveCountryOrder();
  }

  // ---------- Load world data ----------

  async function loadWorld(){
    let topo = null;
    for(const url of TOPOJSON_URLS){
      try{
        const res = await fetch(url);
        if(res.ok){ topo = await res.json(); break; }
      }catch(e){ /* try next */ }
    }
    if(!topo){
      document.getElementById('emptyNote').textContent = '地図データの読み込みに失敗しました。ネットワーク接続を確認してください。';
      return;
    }

    const countries = topojson.feature(topo, topo.objects.countries);
    countryData = countries;

    // Build name index — fetch a names lookup for id->name (world-atlas 110m includes properties.name)
    nameIndex = countries.features.map(f => ({
      id: idOf(f),
      name_en: f.properties.name,
      feature: f
    }));

    // Draw sphere + graticule
    sphereG.append('path')
      .datum({type:"Sphere"})
      .attr('class', 'sphere');

    graticuleG.append('path')
      .datum(graticule)
      .attr('class', 'graticule');

    // Draw countries
    countriesG.selectAll('path')
      .data(countries.features)
      .enter()
      .append('path')

      .on('click', (event, d) => {

      })
      .on('mouseleave', hideTooltip)
      .on('touchstart', (event, d) => {

        showTooltip(jaName(d.properties.name), t.clientX, t.clientY);
        clearTimeout(tooltipTimer);
        tooltipTimer = setTimeout(hideTooltip, 1200);
      })
      .on('touchend', () => {

        tooltipTimer = setTimeout(hideTooltip, 1200);
      });

    setupSize();
    fitProjection();

    updateStats();
    updateChips();

    updateCityChips();
    updateCityStats();

  // ---------- Search (wired to both the desktop side-panel input and the mobile fixed bar) ----------
  function allSearchable(){
    const fromCountries = nameIndex.map(item => ({
      id: item.id, name_en: item.name_en, label: jaName(item.name_en),
      feature: item.feature, isPoint:false
    }));
    const fromPoints = POINT_COUNTRIES.map(p => ({
      id: p.id, name_en: p.name_en, label: p.name_ja,
      lon: p.lon, lat: p.lat, isPoint:true
    }));
    return fromCountries.concat(fromPoints);
  }

  function matchQuery(q){
    if(!q) return [];
    const lower = q.toLowerCase();
    return allSearchable().filter(item => {
      return item.name_en.toLowerCase().includes(lower) || item.label.includes(q);
    }).slice(0, 8);
  }

  function selectCountry(item){
    toggleCountry(item.id, true);
    if(!item.isPoint && item.feature){
      // Pan/zoom the map to the newly added country (point-countries have no shape to zoom to)
      const bounds = path.bounds(item.feature);
      const dx = bounds[1][0] - bounds[0][0];
      const dy = bounds[1][1] - bounds[0][1];
      const cx = (bounds[0][0] + bounds[1][0]) / 2;
      const cy = (bounds[0][1] + bounds[1][1]) / 2;
      const scale = Math.max(1, Math.min(6, 0.7 / Math.max(dx / width, dy / height)));
      const translate = [width/2 - scale*cx, height/2 - scale*cy];
      svg.transition().duration(500).call(
        zoomBehavior.transform,
        d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
      );
    }
  }

  function setupSearch(inputEl, boxEl){
    let activeIndex = -1;

    function renderSuggestions(items){
      boxEl.innerHTML = '';
      activeIndex = -1;
      if(items.length === 0){
        boxEl.classList.remove('open');
        return;
      }
      items.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'suggest-item';
        const isVisited = visited.has(item.id);
        const pointTag = item.isPoint ? '<span class="visited-tag" style="color:var(--gold);">⚑ 小国</span>' : '';
        div.innerHTML = `<span>${item.label}</span>${isVisited ? '<span class="visited-tag">訪問済み</span>' : pointTag}`;
        div.addEventListener('click', () => {
          selectCountry(item);
          inputEl.value = '';
          boxEl.classList.remove('open');
        });
        boxEl.appendChild(div);
      });
      boxEl.classList.add('open');
    }

    inputEl.addEventListener('input', () => {
      renderSuggestions(matchQuery(inputEl.value.trim()));
    });
    inputEl.addEventListener('keydown', (e) => {
      const items = boxEl.querySelectorAll('.suggest-item');
      if(e.key === 'ArrowDown'){
        e.preventDefault();
        activeIndex = Math.min(activeIndex + 1, items.length - 1);
        items.forEach((el,i) => el.classList.toggle('active', i === activeIndex));
      } else if(e.key === 'ArrowUp'){
        e.preventDefault();
        activeIndex = Math.max(activeIndex - 1, 0);
        items.forEach((el,i) => el.classList.toggle('active', i === activeIndex));
      } else if(e.key === 'Enter'){
        const matches = matchQuery(inputEl.value.trim());
        const pick = activeIndex >= 0 ? matches[activeIndex] : matches[0];
        if(pick){
          selectCountry(pick);
          inputEl.value = '';
          boxEl.classList.remove('open');
        }
      } else if(e.key === 'Escape'){
        boxEl.classList.remove('open');
      }
    });
    document.addEventListener('click', (e) => {
      if(!inputEl.contains(e.target) && !boxEl.contains(e.target)){
        boxEl.classList.remove('open');
      }
    });
  }

  setupSearch(document.getElementById('searchInput'), document.getElementById('suggestBox'));
  setupSearch(document.getElementById('searchInputMobile'), document.getElementById('suggestBoxMobile'));

  // ---------- City search: matches major cities, or adds free text as a custom (unpinned) city ----------
  function matchCityQuery(q){

    const lower = q.toLowerCase();
    return MAJOR_CITIES.filter(c => {
      return c.name_en.toLowerCase().includes(lower) || c.name_ja.includes(q);
    }).slice(0, 8);
  }

  function setupCitySearch(inputEl, boxEl){
    let activeIndex = -1;

    function renderSuggestions(items, query){
      boxEl.innerHTML = '';
      activeIndex = -1;
      const hasQuery = query.trim().length > 0;
      if(items.length === 0 && !hasQuery){
        boxEl.classList.remove('open');
        return;
      }
      items.forEach((item) => {
        const div = document.createElement('div');

        const isVisited = visitedCities.has(item.id);
        div.innerHTML = `<span>📍 ${item.name_ja}</span>${isVisited ? '<span class="visited-tag">訪問済み</span>' : ''}`;
        div.addEventListener('click', () => {
          toggleCity(item.id, true);
          inputEl.value = '';
          boxEl.classList.remove('open');
        });
        boxEl.appendChild(div);
      });
      if(hasQuery){
        const exactMajorMatch = MAJOR_CITIES.some(c => c.name_ja === query.trim() || c.name_en.toLowerCase() === query.trim().toLowerCase());
        if(!exactMajorMatch){
          const addDiv = document.createElement('div');
          addDiv.className = 'suggest-item';
          addDiv.innerHTML = `<span>「${query.trim()}」をそのまま追加</span><span class="visited-tag" style="color:var(--gold);">＋追加</span>`;
          addDiv.addEventListener('click', () => {
            addCustomCity(query.trim());
            inputEl.value = '';
            boxEl.classList.remove('open');
          });
          boxEl.appendChild(addDiv);
        }
      }
      boxEl.classList.add('open');
    }

    inputEl.addEventListener('input', () => {
      const q = inputEl.value;
      renderSuggestions(matchCityQuery(q.trim()), q);
    });
    inputEl.addEventListener('keydown', (e) => {
      const items = boxEl.querySelectorAll('.suggest-item');
      if(e.key === 'ArrowDown'){
        e.preventDefault();
        activeIndex = Math.min(activeIndex + 1, items.length - 1);
        items.forEach((el,i) => el.classList.toggle('active', i === activeIndex));
      } else if(e.key === 'ArrowUp'){
        e.preventDefault();
        activeIndex = Math.max(activeIndex - 1, 0);
        items.forEach((el,i) => el.classList.toggle('active', i === activeIndex));
      } else if(e.key === 'Enter'){
        const q = inputEl.value.trim();
        const matches = matchCityQuery(q);
        if(activeIndex >= 0 && matches[activeIndex]){
          toggleCity(matches[activeIndex].id, true);
        } else if(matches.length === 1){
          toggleCity(matches[0].id, true);
        } else if(q){
          addCustomCity(q);
        }
        inputEl.value = '';
        boxEl.classList.remove('open');
      } else if(e.key === 'Escape'){
        boxEl.classList.remove('open');
      }
    });
    document.addEventListener('click', (e) => {
      if(!inputEl.contains(e.target) && !boxEl.contains(e.target)){
        boxEl.classList.remove('open');
      }
    });
  }

  setupCitySearch(document.getElementById('citySearchInput'), document.getElementById('citySuggestBox'));
  setupCitySearch(document.getElementById('citySearchInputMobile'), document.getElementById('citySuggestBoxMobile'));

  // ---------- List pager (switches between "visited countries" and "badges" pages) ----------
  document.querySelectorAll('.pager-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.target; // 'side' or 'sheet'
      const page = btn.dataset.page;     // '1', '2', or '3'
      document.querySelectorAll(`.pager-btn[data-target="${target}"]`).forEach(b => {
        b.classList.toggle('active', b === btn);
      });
      const containerId = target === 'side' ? 'sidePanel' : 'sheet';
      const container = document.getElementById(containerId);
      container.querySelectorAll('.page').forEach(p => {
        p.classList.toggle('active', p.dataset.page === page);
      });
      // Switch the unified top search slot to match the active tab (hidden entirely on the badges tab)
      const searchHost = target === 'side' ? document.getElementById('sidePanel') : document.querySelector('.mobile-search-bar');
      if(searchHost){
        searchHost.querySelectorAll('.search-target').forEach(s => {
          s.classList.toggle('active', s.dataset.targetPage === page);
        });
      }
    });
  });

  // ---------- Bottom panel (always visible) ----------
  const sheet = document.getElementById('sheet');

  // ---------- Actions ----------
  function clearAll(){
    if(visited.size === 0 && visitedCities.size === 0 && customCities.length === 0) return;
    if(confirm('すべての訪問記録（国・都市）を解除しますか？')){
      visited.clear();
      countryOrder = [];
      countriesG.selectAll('path').classed('visited', false);
      updateStats();
      updateChips();
      updateBadges();
      saveState();
      saveCountryOrder();

      visitedCities.clear();
      customCities = [];
      cityOrder = [];
      renderCityPins();
      updateCityChips();
      updateCityStats();
      saveCityState();
      saveCityOrder();
    }
  }
  document.getElementById('clearBtn').addEventListener('click', clearAll);
  document.getElementById('sideClearBtn').addEventListener('click', clearAll);

  // ---------- Data export / import (JSON file), so records survive Safari clearing localStorage ----------
  function exportDataToFile(){
    const payload = {
      exportedAt: new Date().toISOString(),
      formatVersion: 1,
      data: {}
    };
    // Bundle every localStorage key this app uses into one JSON file
    [STORAGE_KEY, BADGE_TOGGLE_KEY, CITY_STORAGE_KEY, CUSTOM_CITY_STORAGE_KEY,
     AGE_STORAGE_KEY, COUNTRY_ORDER_KEY, CITY_ORDER_KEY].forEach(key => {
      try{
        const raw = localStorage.getItem(key);
        if(raw !== null) payload.data[key] = raw;
      }catch(e){}
    });

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const dateStamp = new Date().toISOString().slice(0, 10);
    link.download = `travel-atlas-backup-${dateStamp}.json`;
    link.href = url;
    link.click();
    URL.revokeObjectURL(url);
  }

  function importDataFromFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try{
        parsed = JSON.parse(reader.result);
      }catch(e){
        alert('ファイルの読み込みに失敗しました。正しいバックアップファイルか確認してください。');
        return;
      }
      if(!parsed || typeof parsed.data !== 'object'){
        alert('このファイルはバックアップデータの形式ではないようです。');
        return;
      }
      if(!confirm('現在の記録を、読み込んだデータで上書きします。よろしいですか？')){
        return;
      }
      Object.keys(parsed.data).forEach(key => {
        try{ localStorage.setItem(key, parsed.data[key]); }catch(e){}
      });
      // Reload so every piece of app state re-initializes from the freshly written localStorage
      location.reload();
    };
    reader.onerror = () => {
      alert('ファイルの読み込みに失敗しました。');
    };
    reader.readAsText(file);
  }

  function triggerDataExport(){
    exportDataToFile();
  }
  function triggerDataImport(){
    document.getElementById('dataImportInput').click();
  }

  document.getElementById('dataExportBtn').addEventListener('click', triggerDataExport);
  document.getElementById('sideDataExportBtn').addEventListener('click', triggerDataExport);
  document.getElementById('dataImportBtn').addEventListener('click', triggerDataImport);
  document.getElementById('sideDataImportBtn').addEventListener('click', triggerDataImport);
  document.getElementById('dataImportInput').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if(file) importDataFromFile(file);
    e.target.value = ''; // allow re-selecting the same file later
  });

  function exportPNG(){
    const captureArea = document.getElementById('mapCaptureArea');
    captureArea.classList.add('capturing');
    setTimeout(() => {
      html2canvas(captureArea, { backgroundColor: '#fffdf8', scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'travel-atlas.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        captureArea.classList.remove('capturing');
      });
    }, 100);
  }
  document.getElementById('exportBtn').addEventListener('click', exportPNG);
  document.getElementById('sideExportBtn').addEventListener('click', exportPNG);

  // ---------- Init ----------
  loadWorld();
})();
</script>
